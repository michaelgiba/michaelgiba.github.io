    <link rel="stylesheet" href="style.css">
    <style>
        /* Add CSS here or in style.css for layout */
        .post-entry {
            display: flex;
            align-items: center; /* Align items vertically centered */
            margin-bottom: 0.5rem; /* Reduced space between entries */
            padding: 0;
        }
        .post-thumbnail {
            width: 50px; /* Adjust size as needed */
            height: 50px; /* Adjust size as needed */
            object-fit: cover; /* Maintain aspect ratio */
            margin-right: 1rem; /* Space between thumbnail and date */
            flex-shrink: 0; /* Prevent shrinking */
        }
        .post-date {
            flex: 0 0 80px; /* Adjust width as needed */
            padding-right: 1rem;
            /* padding-top: 0.1rem; Removed as align-items: center handles vertical alignment */
            font-size: 0.85em;
            color: #666;
            white-space: nowrap; /* Prevent date wrapping */
        }
        .post-details {
            flex: 1;
            padding: 0;
        }
        .post-details h2 {
            margin: 0 0 0.1rem 0; /* Minimal margin below title */
            padding: 0;
            font-size: 1.1em; /* Adjust as needed */
            line-height: 1.2;
        }
        .post-details h2 a {
            text-decoration: none;
            color: inherit;
        }
        .post-details .post-subtitle {
            margin: 0;
            padding: 0;
            font-size: 0.9em;
            color: #555;
            line-height: 1.3;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1><a href="/">michael giba</a></h1>
            <nav>
                <ul>
                    <li><a href="https://www.linkedin.com/in/michael-giba-42720a80/">About</a></li>
                </ul>
            </nav>
        </div>
    </header>


    <main>
        <article class="post-entry">
            <div class="post-date">
                <time datetime="2024-07-26">Jul 26, 2024</time>
            </div>
            <img src="static/late_now_generative_show/animation.webp" alt="Thumbnail for Late Now with Walter Spanks" class="post-thumbnail">

            <div class="post-details">
                <h2><a href="late-now-generative-show.html">Late Now with Walter Spanks</a></h2>
                <p class="post-subtitle">An experimental generative comedy</p>
            </div>

        </article>

    </main>

</body>
</html>
